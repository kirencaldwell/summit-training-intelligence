<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Mountain & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Precision Ring (Subtle Metric Dial) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Background Mountain Range (Silhouette) -->
  <polygon points="120,340 210,210 270,280 340,180 430,340" fill="#334155" opacity="0.4" />

  <!-- Foreground Mountain Peak + Power Cadence Line -->
  <path d="M 80 360 L 190 200 L 260 290 L 350 150 L 440 360" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Target Summit / Peak Metric Dot -->
  <circle cx="350" cy="150" r="16" fill="#10b981" />
  <circle cx="350" cy="150" r="28" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6" />

  <!-- Base Elevation Baseline -->
  <line x1="80" y1="384" x2="432" y2="384" stroke="#475569" stroke-width="8" stroke-linecap="round" />
</svg>
